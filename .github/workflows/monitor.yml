name: Release Calendar Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

# ✅ 并发锁：同一时间只允许一个运行；有新运行则取消旧的
concurrency:
  group: release-calendar-monitor
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ✅ 需要完整历史，方便 pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ 仅检查是否“有注入”，不打印 secret 内容
      - name: Check WeCom webhook env
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          if [ -z "$WECOM_WEBHOOK_URL" ]; then
            echo "WECOM_WEBHOOK_URL is EMPTY"
            exit 1
          else
            echo "WECOM_WEBHOOK_URL is SET"
          fi

      - name: Run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: "17"

          # ✅ 兼容保留（即使新脚本未暂时用，也不影响）
          DETAIL_MODE: "0"

          # ✅ Telegram（变量名对齐新脚本）
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ✅ 企业微信（变量名对齐新脚本）
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python monitor_calendars.py

      - name: Commit state.json
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state.json

          # ✅ 没变化就退出
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "chore: update monitor state"

          # ✅ 先对齐远端，再推送（防止 fetch first）
          git pull --rebase origin main
          git push
