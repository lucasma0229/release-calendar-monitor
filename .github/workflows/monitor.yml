name: Release Calendar Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write
  issues: write

# ✅ 防止并发：避免两次 schedule 同时跑导致 push 冲突（fetch first）
concurrency:
  group: release-calendar-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ✅ 必须拉全量历史，后面 pull --rebase 才稳定
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # （可选）如果你之前加过企业微信 env 检查，这里保留占位
      - name: Check WeCom webhook env
        run: |
          if [ -z "${WECOM_WEBHOOK}" ]; then
            echo "WECOM_WEBHOOK not set (ok if you only use Telegram/GitHub)."
          else
            echo "WECOM_WEBHOOK is set."
          fi
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      - name: Run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: "17"

          # Telegram（如果你有用）
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # WeCom（如果你有用）
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          python monitor_calendars.py

      # ✅ 关键修复：push 前先 pull --rebase，并且只在 state.json 有变化时才提交
      - name: Commit state.json safely
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1) 先暂存 state.json
          git add state.json

          # 2) 如果没有变化，直接结束
          git diff --cached --quiet && echo "No changes to state.json" && exit 0

          # 3) 先提交本地变更
          git commit -m "chore: update monitor state"

          # 4) 同步远端（避免冲突）
          git pull --rebase --autostash

          # 5) 推送
          git push
            exit 0
          fi

          # push 失败时自动重试一次（极少数情况下仍可能遇到竞态）
          git push origin "HEAD:${GITHUB_REF_NAME}" || (sleep 2 && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")
