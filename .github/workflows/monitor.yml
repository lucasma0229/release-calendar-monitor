name: Release Calendar Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write
  issues: write

# ✅ 防止并发：避免两次 schedule 同时跑导致 push 冲突（fetch first）
concurrency:
  group: release-calendar-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ✅ 必须拉全量历史，后面 pull --rebase 才稳定
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # （可选）如果你之前加过企业微信 env 检查，这里保留占位
      - name: Check WeCom webhook env
        run: |
          if [ -z "${WECOM_WEBHOOK}" ]; then
            echo "WECOM_WEBHOOK not set (ok if you only use Telegram/GitHub)."
          else
            echo "WECOM_WEBHOOK is set."
          fi
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      - name: Run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: "17"

          # Telegram（如果你有用）
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # WeCom（如果你有用）
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          python monitor_calendars.py

      # ✅ 关键修复：push 前先 pull --rebase，并且只在 state.json 有变化时才提交
      - name: Commit state.json safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 确保 remote url 使用 token（避免权限/交互问题）
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # 拉最新，避免远端比本地新导致 rejected (fetch first)
          git pull --rebase origin "${GITHUB_REF_NAME}"

          # 只提交 state.json（如果有变化）
          if git status --porcelain | grep -q "^ M state.json\|^A  state.json\|^?? state.json"; then
            git add state.json
            git commit -m "chore: update monitor state"
          else
            echo "No changes in state.json. Skip commit."
            exit 0
          fi

          # push 失败时自动重试一次（极少数情况下仍可能遇到竞态）
          git push origin "HEAD:${GITHUB_REF_NAME}" || (sleep 2 && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")
